{{ define "main" }}
<div class="bungkus">
  <div class="judul-halaman">
    <h1>{{ .Title }}</h1>
    <p>Ketik kata kunci dari pertanyaanmu — misalnya nama bab, istilah, atau bunyi soalnya.</p>
  </div>
  <form class="pencarian-halaman" id="form-cari" role="search">
    <input type="search" id="kata-kunci" name="q" placeholder="Cari pertanyaan…" aria-label="Kata kunci pencarian">
    <button type="submit">Cari</button>
  </form>
  <p id="ringkasan-cari" style="color:var(--slate-muda)"></p>
  <div id="hasil-cari"></div>
</div>
{{ end }}
